<div class="g-grid">

<p class="g-lead">We commit to a minimum number of new registrations for your TLD. If we fall short, the gap becomes credit toward your 2028 MDF package, so you never pay for growth you didn&#x27;t get.</p>
<ol class="g-steps">

<li><i>2</i><div><b>Every new registration counts</b><span>All new registrations of your TLD at Mat Bao during the 12-month term are counted, whether they come from search, AI suggestions, Vibe Hosting, bundles or boosted ads.</span></div></li>
<li><i>3</i><div><b>We settle at year end</b><span>If actual registrations are below the floor, the shortfall is converted into credit toward your MDF 2028 package.</span></div></li>
</ol>
</div>

<div class="g-card">
<img src="images/guarantee.svg" alt="" class="g-shield">
<div class="g-label">Shortfall credit</div>
<div class="g-formula">Credit = Package fee × <span class="frac"><span>Guaranteed − Actual</span><span>Guaranteed</span></span></div>
<div class="g-cap">Capped at 50% of the package fee</div>

<div class="g-ex-row"><span>Guaranteed floor</span><b>2,000</b></div>
<div class="g-ex-row"><span>Actual new registrations</span><b>1,600</b></div>
<div class="g-ex-row"><span>Shortfall</span><b>20%</b></div>
<div class="g-ex-row total"><span>Credit on a $6,500 package</span><b>$1,300</b></div></div>
</div>
<ul class="g-fine">
<li>Counts new registrations only (not renewals or transfers).</li>
<li>Applies to annual Diamond plans (12-month term).</li>
<li>Credit applies to the MDF 2028 Program only. It is not cash and cannot be transferred.</li>
<li>Requires your TLD to stay available for registration, with no wholesale price increase during the term, and brand assets delivered on time.</li>
</ul>
